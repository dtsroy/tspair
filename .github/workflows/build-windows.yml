name: build-windows

on:
  workflow_dispatch:
  push:
    branches: [master, dev]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Build app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # No release tagName → artifacts only; add a tagName to publish.
          args: ""

      - name: Stage portable executable
        shell: pwsh
        run: |
          # Tauri embeds the frontend in the exe, so the raw binary is a
          # self-contained portable build (needs the WebView2 runtime, which
          # ships with Windows 11).
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item src-tauri/target/release/tspair.exe portable/tspair.exe

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: tspair-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: tspair-windows-portable
          path: portable/tspair.exe
          if-no-files-found: error
